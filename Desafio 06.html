<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .bloco {
            padding: 10px;
            background-color: gray;
            width: 30%;
            margin: auto;
            text-align: center;
            border-radius: 5px;
        }

        .bloco input {
            margin: 10px auto;
            width: 95%;
            padding: 10px;
        }
        .bloco button{
            padding: 10px;
            width: 22%;
        }
    </style>
</head>

<body>
    <div class="bloco">
        <h1>Desafio 6</h1>
        <input type="text" id="entrada" placeholder="Digite o valor de entrada"><br>
        <button id="add" onclick="adicionarValor()">Adicionar</button>
        <button id="ord" onclick="adicionarOrdem()">Ordenar</button>
        <button>Deletar</button>
        <button>Pesquisar</button>
        <input type="textarea" id = "saida" disabled="disabled">
    </div>
    <script>
        var lista = []
        function adicionarValor(){
            var ent = document.getElementById('entrada').value;
            lista.unshift(ent);
            document.getElementById('saida').value = lista;
            document.getElementById('entrada').value = null;
        }
        var lista = []
        function adicionarOrdem(){
            var ord = document.getElementById('ordenar').value;
            lista.sort(ent);
            document.getElementById('saida').value = lista;
            document.getElementById('ordenar').value = null;
        }
    </script>
</body>

</html>
