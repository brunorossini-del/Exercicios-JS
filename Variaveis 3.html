<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variaveis JS</title>
    <script>
        var nome = prompt('Qual seu nome?');
        var saldo = prompt('Qual seu salario?');
        var venda = prompt ('Quanto você vendeu esse mês?');
    
        var soma = Number(venda * 0.025) + Number(saldo);
    </script>
</head>
<body>
    <script>
        document.write('<h1 >Olá ' + nome + ' seu salário desse mês será de ' + soma +'</h1>')
    </script>
</body>
</html>
