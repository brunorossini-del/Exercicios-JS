<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulação DOM por ID</title>
</head>
<body>
    <input type="text" id="entrada" onkeyup="mostrarValor()">
    <input type="text" id="saida" disabled="disabled">
    <script>
        function mostrarValor() {
            // capturando o valor
            var texto = document.getElementById('entrada').value;

            // enviando o valor 
            document.getElementById('saida').value = texto;
        }
    </script>
</body>
</html>
