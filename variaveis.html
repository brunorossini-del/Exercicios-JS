<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variaveis JS</title>
    <script>
        //string
        var texto = 'Curso de JavaScript';
        //number
        var numerInteiro = -7;
        var numberFracionado = 10.45;
        //boolean
        var teste = true; //true-false
    </script>
</head>
<body>
    <h1>Variáveis</h1>
    <script>
        alert(texto);
        document.write(texto);
        console.log(texto);
    </script>
</body>
</html>
