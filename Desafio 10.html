<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAVA SCRIPT</title>
    <style>
        .estilo1 {
            background: red;
            color: white;
        }
        .estilo2{
            width: 400px;
            height: 50px;
            background-color: red;
            text-align: center;
            font-size: 25px;
            color: white;
            padding: 25px;
        }
    </style>
    <script>
        function modificaClasse(){
            document.getElementById('mensagme').className = 'estilo2'
        }
    </script>
</head>
<body>
    <div id="mensagme" class="estilo1">Modificando a classe do elemento</div>
    <hr>
    <button type="button" onclick="modificaClasse()">Aplicar Classe</button>
</body>
</html>
